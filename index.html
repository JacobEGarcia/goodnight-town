<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOODNIGHT TOWN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{--ink:#e8dfd2;--dim:#8d84a0;--accent:#ffb36b;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#0b0817;color:var(--ink);font-family:Inter,sans-serif;overflow:hidden;}
  #game{position:fixed;inset:0;width:100vw;height:100vh;image-rendering:pixelated;cursor:grab;}
  #vhs{position:fixed;inset:0;pointer-events:none;z-index:5;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.13) 0 1px,transparent 1px 3px);
    mix-blend-mode:multiply;}
  #vhs::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(5,2,12,.55) 100%);}
  #osd{position:fixed;top:18px;left:22px;z-index:6;font-size:11px;letter-spacing:.3em;color:#cfc4dd;opacity:.75;}
  #osd .rec{display:inline-block;width:8px;height:8px;background:#ff5a4e;border-radius:50%;margin-right:8px;animation:blink 1.6s steps(2) infinite;}
  @keyframes blink{50%{opacity:.15;}}
  #clock{position:fixed;top:18px;right:22px;z-index:6;font-family:Fraunces,serif;font-size:15px;letter-spacing:.14em;color:#cfc4dd;opacity:.85;}
  #fireflies{position:fixed;bottom:22px;left:22px;z-index:6;font-size:11px;letter-spacing:.28em;color:var(--dim);}
  #fireflies b{color:var(--accent);font-weight:400;}
  #prompt{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);z-index:6;font-size:11px;letter-spacing:.3em;color:#cfc4dd;opacity:0;transition:opacity .25s;}
  #prompt.on{opacity:.9;}
  #dialog{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);max-width:560px;width:calc(100vw - 48px);z-index:7;
    background:rgba(13,9,26,.9);border:1px solid rgba(207,196,221,.18);padding:16px 20px;opacity:0;pointer-events:none;transition:opacity .3s;}
  #dialog.on{opacity:1;}
  #dialog .who{font-size:10px;letter-spacing:.32em;color:var(--accent);margin-bottom:6px;}
  #dialog .what{font-family:Fraunces,serif;font-weight:300;font-size:17px;line-height:1.45;color:var(--ink);}
  #title{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#0b0817;transition:opacity 1.2s;}
  #title.hidden{opacity:0;pointer-events:none;}
  #title h1{font-family:Fraunces,serif;font-weight:300;font-size:clamp(40px,7vw,84px);letter-spacing:.16em;}
  #title p{margin-top:14px;color:var(--dim);font-size:12px;letter-spacing:.3em;text-align:center;line-height:2.1;}
  #title button{margin-top:36px;background:none;border:1px solid rgba(232,223,210,.35);color:var(--ink);font-family:Inter;font-size:11px;letter-spacing:.34em;padding:14px 36px;cursor:pointer;}
  #title button:hover{border-color:var(--accent);color:var(--accent);}
  #end{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;justify-content:center;align-items:center;opacity:0;pointer-events:none;transition:opacity 3s;background:rgba(20,12,30,.35);}
  #end.on{opacity:1;}
  #end h2{font-family:Fraunces,serif;font-weight:300;font-size:clamp(28px,4.6vw,52px);letter-spacing:.12em;color:#fdf6ec;}
  #end p{margin-top:12px;font-size:11px;letter-spacing:.3em;color:#e8c9a0;}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="vhs"></div>
<div id="osd"><span class="rec"></span><span id="osdmode">PLAY ▶</span></div>
<div id="clock">9:47 PM</div>
<div id="fireflies">FIREFLIES <b id="fc">0</b> / 9</div>
<div id="prompt">E — TALK</div>
<div id="dialog"><div class="who"></div><div class="what"></div></div>
<div id="end"><h2>the morning comes back</h2><p>GOODNIGHT, TOWN</p></div>
<div id="title">
  <h1>GOODNIGHT TOWN</h1>
  <p>THE SKY HAS BEEN STUCK AT 9:47 PM SINCE THE BROADCAST ENDED.<br>
     NINE FIREFLIES STILL KEEP THE LIGHT. FIND THEM ALL.<br><br>
     WASD — WALK &nbsp;·&nbsp; DRAG — LOOK &nbsp;·&nbsp; E — TALK</p>
  <button id="start">BEGIN THE WALK</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const QA=new URLSearchParams(location.search).has('qa');
const canvas=document.getElementById('game');
const renderer=new THREE.WebGLRenderer({canvas,antialias:false});
renderer.setSize(480,270,false);renderer.setPixelRatio(1);
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x1a1030,0.035);
const camera=new THREE.PerspectiveCamera(60,480/270,.1,300);

// ---- dusk sky dome (stuck at 9:47pm) ----
function skyTexture(stops){const c=document.createElement('canvas');c.width=2;c.height=512;const g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,512);stops.forEach(([o,col])=>gr.addColorStop(o,col));
  g.fillStyle=gr;g.fillRect(0,0,2,512);const t=new THREE.CanvasTexture(c);return t;}
const skyMat=new THREE.MeshBasicMaterial({map:skyTexture([[0,'#120b2e'],[.42,'#33215c'],[.62,'#7a3a63'],[.74,'#d8622f'],[.78,'#f09a4b'],[.82,'#2a1440'],[1,'#0b0716']]),side:THREE.BackSide,fog:false});
const sky=new THREE.Mesh(new THREE.SphereGeometry(180,24,16),skyMat);scene.add(sky);

// lights
const amb=new THREE.AmbientLight(0x4a3a6a,.85);scene.add(amb);
const moon=new THREE.DirectionalLight(0x8fa0ff,.5);moon.position.set(-30,50,-20);scene.add(moon);

// ground
const ground=new THREE.Mesh(new THREE.PlaneGeometry(300,300),new THREE.MeshLambertMaterial({color:0x241a33}));ground.rotation.x=-Math.PI/2;scene.add(ground);
// road
const road=new THREE.Mesh(new THREE.PlaneGeometry(10,120),new THREE.MeshLambertMaterial({color:0x191224}));road.rotation.x=-Math.PI/2;road.position.y=.02;scene.add(road);
const road2=new THREE.Mesh(new THREE.PlaneGeometry(120,10),road.material);road2.rotation.x=-Math.PI/2;road2.position.y=.02;scene.add(road2);
// sidewalks
[[7,0],[ -7,0],[0,7],[0,-7]].forEach(([x,z],i)=>{const sw=new THREE.Mesh(new THREE.BoxGeometry(i<2?3:120,.12,i<2?120:3),new THREE.MeshLambertMaterial({color:0x2e2342}));sw.position.set(x,.06,z);scene.add(sw);});
// lane dashes
for(let z=-58;z<=58;z+=6){const d=new THREE.Mesh(new THREE.PlaneGeometry(.4,2.4),new THREE.MeshBasicMaterial({color:0x6b5a44}));d.rotation.x=-Math.PI/2;d.position.set(0,.035,z);scene.add(d);}

// ---- buildings with lit windows + neon signs ----
const blocks=[]; // AABBs for collision {x0,x1,z0,z1}
function windowsTexture(w,h,density,warm){const c=document.createElement('canvas');c.width=64;c.height=128;const g=c.getContext('2d');
  g.fillStyle=warm?'#241b38':'#1d1630';g.fillRect(0,0,64,128);
  for(let y=8;y<120;y+=12)for(let x=6;x<58;x+=10){if(Math.random()<density){g.fillStyle=Math.random()<.7?'rgba(255,190,110,.95)':'rgba(160,200,255,.85)';g.fillRect(x,y,6,8);}}
  return new THREE.CanvasTexture(c);}
function neonTexture(text,color){const c=document.createElement('canvas');c.width=256;c.height=64;const g=c.getContext('2d');
  g.fillStyle='#0d0918';g.fillRect(0,0,256,64);g.font='bold 34px Arial';g.textAlign='center';g.textBaseline='middle';
  g.shadowColor=color;g.shadowBlur=16;g.fillStyle=color;g.fillText(text,128,34);g.shadowBlur=4;g.fillStyle='#fff';g.globalAlpha=.85;g.fillText(text,128,34);
  return new THREE.CanvasTexture(c);}
const SIGNS=[['FRESH','#7dffa8'],['MILK BAR','#ffd27d'],['TV REPAIR','#7dc9ff'],['KISSA','#ff7db1'],['RECORDS','#c99aff'],['RAMEN','#ff9a6b'],['HOTEL','#8affea'],['BOOKS','#ffe08a']];
const flickers=[];
function building(x,z,w,h,d,si){
  const warm=Math.random()<.5;
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({map:windowsTexture(w,h,.4,warm)}));
  m.position.set(x,h/2,z);scene.add(m);blocks.push({x0:x-w/2-.6,x1:x+w/2+.6,z0:z-d/2-.6,z1:z+d/2+.6});
  if(si!=null){const[txt,col]=SIGNS[si%SIGNS.length];
    const sign=new THREE.Mesh(new THREE.PlaneGeometry(Math.min(w-1,6),1.5),new THREE.MeshBasicMaterial({map:neonTexture(txt,col),transparent:true}));
    const facing=z>0?-1:1;sign.position.set(x,2.6,z+facing*(d/2+.06));if(facing<0)sign.rotation.y=Math.PI;scene.add(sign);
    const glow=new THREE.PointLight(new THREE.Color(col),1.1,9);glow.position.set(x,2.6,z+facing*(d/2+1));scene.add(glow);
    flickers.push({sign,glow,seed:Math.random()*10});}
}
let si=0;
for(let z=-48;z<=48;z+=16){building(-14,z,8,8+Math.random()*10,10,si++);building(14,z+8,8,8+Math.random()*10,10,si++);}
for(let x=-40;x<=40;x+=16){if(Math.abs(x)<10)continue;building(x,-14,10,7+Math.random()*8,8,null);building(x,14,10,7+Math.random()*8,8,null);}

// ---- street lamps ----
const lamps=[];
function lamp(x,z){const g=new THREE.Group();
  const pole=new THREE.Mesh(new THREE.CylinderGeometry(.07,.09,4.4),new THREE.MeshLambertMaterial({color:0x14101e}));pole.position.y=2.2;g.add(pole);
  const bulb=new THREE.Mesh(new THREE.SphereGeometry(.16,8,8),new THREE.MeshBasicMaterial({color:0xffc37d}));bulb.position.y=4.4;g.add(bulb);
  const l=new THREE.PointLight(0xffb36b,1.3,12);l.position.y=4.3;g.add(l);
  const pool=new THREE.Mesh(new THREE.CircleGeometry(2.2,20),new THREE.MeshBasicMaterial({color:0xffb36b,transparent:true,opacity:.10}));pool.rotation.x=-Math.PI/2;pool.position.y=.045;g.add(pool);
  g.position.set(x,0,z);scene.add(g);lamps.push(l);}
for(let z=-48;z<=48;z+=16){lamp(6.2,z);lamp(-6.2,z+8);}

// ---- power poles + sagging wires ----
function pole(x,z){const p=new THREE.Mesh(new THREE.CylinderGeometry(.09,.11,7),new THREE.MeshLambertMaterial({color:0x120d1a}));p.position.set(x,3.5,z);scene.add(p);
  const cross=new THREE.Mesh(new THREE.BoxGeometry(2.4,.12,.12),p.material);cross.position.set(x,6.4,z);scene.add(cross);return new THREE.Vector3(x,6.4,z);}
const poleTops=[];for(let z=-56;z<=56;z+=14)poleTops.push(pole(8.6,z));
for(let i=0;i<poleTops.length-1;i++){const a=poleTops[i],b=poleTops[i+1];
  [-.9,0,.9].forEach(off=>{const pts=[];for(let t=0;t<=12;t++){const u=t/12;
      pts.push(new THREE.Vector3(a.x+off, a.y-(Math.sin(u*Math.PI))*.9, a.z+(b.z-a.z)*u));}
    const w=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0x0a0712}));scene.add(w);});}

// ---- string lights across the main street ----
const stringLights=[];
for(let z=-40;z<=40;z+=10){const pts=[];for(let t=0;t<=20;t++){const u=t/20;pts.push(new THREE.Vector3(-8+u*16,5.2-Math.sin(u*Math.PI)*.8,z));}
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0x05030a})));
  for(let t=0;t<=8;t++){const u=t/8;const b=new THREE.Mesh(new THREE.SphereGeometry(.09,6,6),new THREE.MeshBasicMaterial({color:[0xffd27d,0xff9db1,0x9dc9ff][t%3]}));
    b.position.set(-8+u*16,5.2-Math.sin(u*Math.PI)*.8-.12,z);scene.add(b);stringLights.push(b);}}

// ---- vending machines ----
function vending(x,z,ry){const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(1,2,.8),new THREE.MeshLambertMaterial({color:0x8a2030}));body.position.y=1;g.add(body);
  const face=new THREE.Mesh(new THREE.PlaneGeometry(.8,1.4),new THREE.MeshBasicMaterial({color:0xbfe6ff}));face.position.set(0,1.15,.41);g.add(face);
  const l=new THREE.PointLight(0x9fd4ff,.8,4);l.position.set(0,1.4,.8);g.add(l);
  g.position.set(x,0,z);g.rotation.y=ry;scene.add(g);}
vending(6.4,-20,Math.PI);vending(-6.4,14,0);vending(20,-6.4,Math.PI/2);

// ---- the cat (player) ----
function stripeTexture(){const c=document.createElement('canvas');c.width=64;c.height=64;const g=c.getContext('2d');
  for(let y=0;y<64;y+=8){g.fillStyle=(y/8)%2?'#3a4a6b':'#e8e2d4';g.fillRect(0,y,64,8);}return new THREE.CanvasTexture(c);}
const cat=new THREE.Group();
const body=new THREE.Mesh(new THREE.BoxGeometry(.7,.8,.45),new THREE.MeshLambertMaterial({map:stripeTexture()}));body.position.y=.95;cat.add(body);
const head=new THREE.Mesh(new THREE.BoxGeometry(.95,.8,.7),new THREE.MeshLambertMaterial({color:0xc9a37a}));head.position.y=1.85;cat.add(head);
[-1,1].forEach(s=>{const ear=new THREE.Mesh(new THREE.ConeGeometry(.16,.3,4),head.material);ear.position.set(.3*s,2.4,0);cat.add(ear);
  const eye=new THREE.Mesh(new THREE.SphereGeometry(.13,8,8),new THREE.MeshBasicMaterial({color:0x0a0612}));eye.position.set(.22*s,1.92,.36);cat.add(eye);
  const leg=new THREE.Mesh(new THREE.BoxGeometry(.2,.55,.2),new THREE.MeshLambertMaterial({color:0xc9a37a}));leg.position.set(.18*s,.28,0);leg.name='leg'+s;cat.add(leg);
  const shoe=new THREE.Mesh(new THREE.BoxGeometry(.24,.14,.36),new THREE.MeshLambertMaterial({color:0xf2efe8}));shoe.position.set(.18*s,.07,.05);cat.add(shoe);});
const tail=new THREE.Mesh(new THREE.CylinderGeometry(.05,.07,.7),head.material);tail.position.set(0,.9,-.35);tail.rotation.x=-.7;cat.add(tail);
cat.position.set(0,0,30);scene.add(cat);

// ---- NPCs ----
const npcs=[];
const LINES=[
 ['THE FISHERMAN',["They switched the sky off mid-sentence. Nine forty-seven, forever.","I fish the canal now. The fish don't mind. Fish don't own clocks."]],
 ['THE WOMAN WITH THE UMBRELLA',["It hasn't rained in weeks. I keep it open anyway. A promise is a promise.","The fireflies remember the morning. Nine of them, still burning. Find them and the town can sleep properly."]],
 ['THE BOY',["Mom says the sun is just running late, like dad.","If you catch the fireflies, put one in a jar for me. Just kidding. They hate jars."]],
 ['THE ORGAN PLAYER',["I play the same eight bars every night. Nobody has complained. Nobody is left to complain.","The neon hums in E-flat. I checked once."]],
 ['THE CAT SITTER',["The cats all came back after the broadcast. Animals always come back.","You're a long way from your basket, little one."]]];
const NPC_COLORS=[0x6b4a3a,0x3a5a4b,0x4b3a6b,0x5a5a3a,0x3a4a5a];
function npc(x,z,i){const g=new THREE.Group();
  const b=new THREE.Mesh(new THREE.BoxGeometry(.6,.85,.4),new THREE.MeshLambertMaterial({color:NPC_COLORS[i]}));b.position.y=.95;g.add(b);
  const h=new THREE.Mesh(new THREE.BoxGeometry(.5,.45,.42),new THREE.MeshLambertMaterial({color:0xd9b48c}));h.position.y=1.65;g.add(h);
  [-1,1].forEach(s=>{const leg=new THREE.Mesh(new THREE.BoxGeometry(.17,.55,.17),new THREE.MeshLambertMaterial({color:0x241d30}));leg.position.set(.15*s,.28,0);g.add(leg);});
  g.position.set(x,0,z);scene.add(g);npcs.push({g,lines:LINES[i][1],who:LINES[i][0],li:0});}
npc(9,-8,0);npc(-10,4,1);npc(4,18,2);npc(-16,-24,3);npc(18,10,4);

// ---- fireflies ----
const flies=[];
const FLY_POS=[[3,-34],[-5,-14],[10,6],[-9,22],[5,36],[22,-3],[-24,-8],[30,9],[-2,-44]];
FLY_POS.forEach(([x,z])=>{const s=new THREE.Sprite(new THREE.SpriteMaterial({color:0xd8ff9a,transparent:true,opacity:.95,blending:THREE.AdditiveBlending}));
  s.scale.set(.5,.5,1);s.position.set(x,1.4+Math.random(),z);scene.add(s);
  const l=new THREE.PointLight(0xc8ff8a,.7,5);l.position.copy(s.position);scene.add(l);
  flies.push({s,l,got:false,ph:Math.random()*7});});

// ---- audio: the hum ----
let AC=null,humOsc=null;
function audio(){if(AC)return;AC=new (window.AudioContext||window.webkitAudioContext)();
  humOsc=AC.createOscillator();humOsc.type='sawtooth';humOsc.frequency.value=110;
  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=220;
  const g=AC.createGain();g.gain.value=.012;humOsc.connect(f);f.connect(g);g.connect(AC.destination);humOsc.start();
  AC._humGain=g;}
function chime(){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=1320;
  o.frequency.exponentialRampToValueAtTime(1980,AC.currentTime+.08);
  g.gain.setValueAtTime(.08,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+.7);
  o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.75);}

// ---- input & movement ----
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='e')tryTalk();});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let camA=0,drag=false,lx=0;
canvas.addEventListener('mousedown',e=>{drag=true;lx=e.clientX;});
addEventListener('mouseup',()=>drag=false);
addEventListener('mousemove',e=>{if(drag){camA-=(e.clientX-lx)*.006;lx=e.clientX;}});

const P=cat.position;let heading=Math.PI,walkT=0,collected=0,dawn=false,dawnT=0;
function collide(nx,nz){for(const b of blocks){if(nx>b.x0&&nx<b.x1&&nz>b.z0&&nz<b.z1)return true;}return false;}
function tryTalk(){for(const n of npcs){const d=Math.hypot(n.g.position.x-P.x,n.g.position.z-P.z);
  if(d<2.2){const box=document.getElementById('dialog');box.querySelector('.who').textContent=n.who;
    box.querySelector('.what').textContent='\u201C'+n.lines[n.li]+'\u201D';n.li=(n.li+1)%n.lines.length;
    box.classList.add('on');clearTimeout(box._t);box._t=setTimeout(()=>box.classList.remove('on'),5200);return;}}}
let started=false;document.getElementById('start').addEventListener('click',()=>{started=true;audio();document.getElementById('title').classList.add('hidden');});

const clk=performance.now();let last=clk;
function step(){requestAnimationFrame(step);
  const now=performance.now();const dt=Math.min((now-last)/1000,.05);last=now;const t=now/1000;
  if(started&&!dawn){
    let f=(keys['w']?1:0)-(keys['s']?1:0),s=(keys['d']?1:0)-(keys['a']?1:0);
    if(f||s){const l=Math.hypot(f,s);f/=l;s/=l;walkT+=dt*8;
      const sp=4.2;
      const dx=(Math.sin(camA)*f+Math.cos(camA)*s)*sp*dt;
      const dz=(Math.cos(camA)*f-Math.sin(camA)*s)*sp*dt;
      if(!collide(P.x-dx,P.z))P.x-=dx;
      if(!collide(P.x,P.z-dz))P.z-=dz;
      P.x=Math.max(-56,Math.min(56,P.x));P.z=Math.max(-56,Math.min(56,P.z));
      heading=Math.atan2(dx,dz);cat.rotation.y+=(heading-cat.rotation.y)*.2;
      cat.position.y=Math.abs(Math.sin(walkT))*.09;
      cat.getObjectByName('leg1').rotation.x=Math.sin(walkT)*.5;
      cat.getObjectByName('leg-1').rotation.x=-Math.sin(walkT)*.5;
    }else{cat.position.y*=.9;}
    // fireflies
    for(const fl of flies){if(fl.got)continue;
      fl.s.position.y=1.4+Math.sin(t*1.7+fl.ph)*.35;fl.l.position.copy(fl.s.position);
      fl.s.material.opacity=.6+Math.sin(t*3+fl.ph)*.35;
      if(Math.hypot(fl.s.position.x-P.x,fl.s.position.z-P.z)<1.3){fl.got=true;fl.s.visible=false;fl.l.intensity=0;collected++;chime();
        document.getElementById('fc').textContent=collected;
        if(collected>=9){dawn=true;dawnT=0;}}}
    // prompt
    let near=false;for(const n of npcs){if(Math.hypot(n.g.position.x-P.x,n.g.position.z-P.z)<2.2){near=true;n.g.lookAt(P.x,1,P.z);}}
    document.getElementById('prompt').classList.toggle('on',near);
    // camera
    const cx=P.x+Math.sin(camA)*6,cz=P.z+Math.cos(camA)*6;
    camera.position.lerp(new THREE.Vector3(cx,3.4,cz),.08);camera.lookAt(P.x,1.6,P.z);
  }
  // ambience
  flickers.forEach(fl=>{const v=.75+Math.sin(t*13+fl.seed)*.1+(Math.sin(t*47+fl.seed)>.94?-.55:0);fl.glow.intensity=1.1*v;});
  stringLights.forEach((b,i)=>{b.material.opacity=1;b.visible=Math.sin(t*2+i*1.3)>-.9;});
  // dawn
  if(dawn){dawnT+=dt;const u=Math.min(dawnT/25,1);
    scene.fog.color.setHex(0x1a1030).lerp(new THREE.Color(0xd9a06a),u);scene.fog.density=.035-u*.02;
    skyMat.map=skyTexture([[0,'#4a3a7c'].concat([[.42,'#8a5a9c'],[.62,'#e08a5a'],[.74,'#f7c98a'],[.78,'#ffe8c0'],[.82,'#7c5a9c'],[1,'#3a2a5c']]).map((st,i,a)=>i===0?[0,'#4a3a7c']:st)].map(x=>x));
    amb.intensity=.85+u*1.1;moon.intensity=.5+u*.9;
    lamps.forEach(l=>l.intensity=1.3*(1-u));
    if(AC&&AC._humGain)AC._humGain.gain.value=.012*(1-u);
    document.getElementById('clock').textContent=u<1?'9:47 PM':'6:00 AM';
    if(u>=1){document.getElementById('osdmode').textContent='STOP ■';document.getElementById('end').classList.add('on');dawn=false;}
    camera.position.lerp(new THREE.Vector3(P.x+Math.sin(camA)*6,3.4+u*3,P.z+Math.cos(camA)*6),.05);camera.lookAt(P.x,1.6,P.z);
  }
  renderer.render(scene,camera);
}
if(QA){started=true;const tt=document.getElementById('title');tt.classList.add('hidden');tt.style.display='none';camera.position.set(P.x,3.4,P.z+6);camera.lookAt(P.x,1.6,P.z);}
step();
